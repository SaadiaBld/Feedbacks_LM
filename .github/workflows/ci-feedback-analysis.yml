name: CI/CD Feedback Analysis

on:
  push:
    branches:
      - main
      - ci-cd-tests
  pull_request:
    branches:
      - main
      - ci-cd-tests
  workflow_dispatch: # Permet de déclencher la chaîne manuellement
  schedule:
    - cron: '0 0 * * *' # Déclenche la chaîne tous les jours à minuit UTC

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov # Ajout de pytest-cov pour la couverture

      - name: Run Unit Tests (Prompt Utils)
        env:
          PYTEST_RUNNING: "true"
        run: |
          pytest tests/test_prompt_utils.py

      - name: Run Unit Tests (Claude Interface & Output Validation)
        env:
          PYTEST_RUNNING: "true"
        run: |
          pytest tests/test_claude_interface.py

      - name: Run Integration Tests (Claude Golden Set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # Utilise un secret GitHub
          PYTEST_RUNNING: "true"
        run: |
          pytest tests/test_claude_integration.py

      - name: Run Other Unit Tests
        env:
          PYTEST_RUNNING: "true"
        run: |
          # Exécute les autres tests unitaires, en ignorant les tests d'intégration et les tests de DAG
          pytest tests/ --ignore=tests/test_claude_integration.py --ignore=tests/test_dag_workflow.py

      - name: Upload test results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/reports/
